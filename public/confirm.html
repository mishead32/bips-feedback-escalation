<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Your Feedback – BIPS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#EEF2F8;font-family:Arial,Helvetica,sans-serif;color:#1d2433}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #D9E1EC;border-radius:12px;overflow:hidden}
  .hd{background:#1F3864;color:#fff;padding:18px 20px;text-align:center}
  .hd small{display:block;opacity:.85;font-size:11px;letter-spacing:.12em}
  .hd h1{margin:6px 0 0;font-size:20px}
  .bd{padding:18px 20px}
  .info{background:#F6F8FC;border:1px solid #E1E7F0;border-radius:8px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:14px}
  .info b{color:#44546A;display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
  .info b:first-child{margin-top:0}
  .info div{white-space:pre-wrap}
  .q{font-size:17px;font-weight:bold;text-align:center;margin:18px 0 12px}
  .ch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{border:2px solid #D9E1EC;background:#fff;border-radius:10px;padding:16px 8px;font-size:16px;font-weight:bold;cursor:pointer;text-align:center}
  .opt .i{font-size:28px;display:block;margin-bottom:4px}
  .opt.yes.on{border-color:#2E7D4F;background:#E3F4E8;color:#1B4D30}
  .opt.no.on{border-color:#C0392B;background:#FDE4E1;color:#7A1F14}
  label{display:block;font-weight:bold;margin:16px 0 6px;font-size:14px}
  textarea{width:100%;font:inherit;font-size:15px;padding:10px;border:1px solid #C5D0E0;border-radius:8px;min-height:110px}
  button.sub{margin-top:16px;width:100%;padding:14px;font-size:16px;font-weight:bold;border:0;border-radius:8px;background:#1F3864;color:#fff;cursor:pointer}
  button.sub:disabled{opacity:.5}
  .msg{padding:16px;border-radius:8px;font-size:15px;line-height:1.5;text-align:center}
  .ok{background:#E3F4E8;color:#1B4D30}.err{background:#FDE4E1;color:#7A1F14}.warn{background:#FFF4DE;color:#6B4A00}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="hd"><small>BHUPINDRA INTERNATIONAL PUBLIC SCHOOL</small><h1>Are you satisfied with the action taken?</h1></div>
  <div class="bd" id="bd">Loading…</div>
</div></div>
<script>
var P=new URLSearchParams(location.search),T=P.get('t'),PK=P.get('p'),choice='';
var bd=document.getElementById('bd');
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
fetch('/api/confirm?t='+encodeURIComponent(T||'')+'&p='+encodeURIComponent(PK||'')).then(function(r){return r.json()}).then(function(j){
  if(j.error){bd.innerHTML='<div class="msg err">'+esc(j.error)+'</div>';return}
  var t=j.ticket;
  var info='<div class="info"><b>Ticket No</b><div>'+esc(t.id)+'</div><b>Student</b><div>'+esc(t.student)+(t.cls?', Class '+esc(t.cls):'')+'</div><b>Your concern</b><div>'+esc(t.concern)+'</div><b>Action taken by the school</b><div>'+esc(t.resolution)+'</div></div>';
  if(!j.open){bd.innerHTML=info+'<div class="msg ok">Thank you, your response'+(j.answered?' ('+esc(j.answered)+')':'')+' has already been recorded.</div>';return}
  bd.innerHTML='<p style="margin:0 0 12px">Dear '+esc(t.parent)+', thank you for your feedback. Please tell us if you are satisfied with the action taken.</p>'+info+
    '<div class="q">Are you satisfied?</div><div class="ch"><div class="opt yes" data-v="Satisfied"><span class="i">&#10004;</span>Satisfied</div><div class="opt no" data-v="Not Satisfied"><span class="i">&#10006;</span>Not Satisfied</div></div>'+
    '<div id="rm" style="display:none"><label for="txt">Please tell us what more we can do *</label><textarea id="txt" placeholder="Write your remarks here…"></textarea></div>'+
    '<button class="sub" id="b" disabled>Submit</button><div id="m" style="margin-top:12px"></div>';
  [].forEach.call(document.querySelectorAll('.opt'),function(o){o.onclick=function(){
    choice=o.dataset.v;[].forEach.call(document.querySelectorAll('.opt'),function(x){x.classList.toggle('on',x===o)});
    document.getElementById('rm').style.display=choice==='Not Satisfied'?'block':'none';document.getElementById('b').disabled=false;
  }});
  document.getElementById('b').onclick=function(){
    var b=this,m=document.getElementById('m'),rm=(document.getElementById('txt').value||'').trim();
    if(choice==='Not Satisfied'&&rm.length<3){m.className='msg err';m.textContent='Please write your remarks.';return}
    b.disabled=true;b.textContent='Submitting…';
    fetch('/api/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:T,p:PK,response:choice,remarks:rm})})
      .then(function(r){return r.json()}).then(function(j){
        if(j.error)throw new Error(j.error);
        bd.innerHTML=choice==='Satisfied'
          ?'<div class="msg ok"><b>Thank you!</b><br>We are glad your concern has been resolved. Your ticket '+esc(t.id)+' is now closed.<br><br>Warm regards,<br>Bhupindra International Public School</div>'
          :'<div class="msg warn"><b>We are sorry the action did not meet your expectations.</b><br>Your concern has been escalated again to senior management and we will get back to you within 24 hours.<br><br>Warm regards,<br>Bhupindra International Public School</div>';
      }).catch(function(e){b.disabled=false;b.textContent='Submit';m.className='msg err';m.textContent=e.message});
  };
}).catch(function(){bd.innerHTML='<div class="msg err">Could not load. Please check your internet and open the link again.</div>'});
</script>
</body>
</html>
